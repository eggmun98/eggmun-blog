<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0d1b25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
<rect x="80" y="120" width="670" height="600" rx="18" fill="#150c0ccc" stroke="#ff4038" stroke-width="2" opacity="1"/>
<rect x="850" y="120" width="670" height="600" rx="18" fill="#0b170fcc" stroke="#54d85b" stroke-width="2" opacity="1"/>
<text x="415" y="190" fill="#ff4038" font-size="36" font-weight="800" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">wrong model</text>
<text x="1185" y="190" fill="#54d85b" font-size="36" font-weight="800" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">actual model</text>
<rect x="135" y="315" width="170" height="105" rx="12" fill="#0b1821" stroke="#c47cff" stroke-width="2" opacity="1"/><text x="220" y="358" fill="#c47cff" font-size="25" font-weight="700" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">setTimeout()</text>
<rect x="360" y="315" width="180" height="105" rx="12" fill="#0b1821" stroke="#54d85b" stroke-width="2" opacity="1"/><text x="450" y="358" fill="#54d85b" font-size="25" font-weight="700" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">other thread</text><text x="450" y="393" fill="#d7e0e8" font-size="20" font-weight="400" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">?</text>
<rect x="590" y="315" width="110" height="105" rx="12" fill="#0b1821" stroke="#c47cff" stroke-width="2" opacity="1"/><text x="645" y="358" fill="#c47cff" font-size="25" font-weight="700" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">callback</text>
<path d="M315 368 H350" stroke="#d7e0e8" stroke-width="6"/><path d="M550 368 H585" stroke="#d7e0e8" stroke-width="6"/>
<rect x="895" y="305" width="160" height="105" rx="12" fill="#0b1821" stroke="#c47cff" stroke-width="2" opacity="1"/><text x="975" y="348" fill="#c47cff" font-size="25" font-weight="700" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">setTimeout()</text>
<rect x="1090" y="305" width="150" height="105" rx="12" fill="#0b1821" stroke="#54d85b" stroke-width="2" opacity="1"/><text x="1165" y="348" fill="#54d85b" font-size="25" font-weight="700" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">Timer</text><text x="1165" y="383" fill="#d7e0e8" font-size="20" font-weight="400" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">wait</text>
<rect x="1275" y="305" width="150" height="105" rx="12" fill="#0b1821" stroke="#ffb020" stroke-width="2" opacity="1"/><text x="1350" y="348" fill="#ffb020" font-size="25" font-weight="700" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">Task</text><text x="1350" y="383" fill="#d7e0e8" font-size="20" font-weight="400" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">queue</text>
<rect x="1195" y="470" width="220" height="105" rx="12" fill="#0b1821" stroke="#38a2ff" stroke-width="2" opacity="1"/><text x="1305" y="513" fill="#38a2ff" font-size="25" font-weight="700" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">Main Thread</text><text x="1305" y="548" fill="#d7e0e8" font-size="20" font-weight="400" text-anchor="middle" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">callback runs</text>
<path d="M1065 358 H1080" stroke="#d7e0e8" stroke-width="6"/><path d="M1250 358 H1265" stroke="#d7e0e8" stroke-width="6"/><path d="M1350 415 V460" stroke="#d7e0e8" stroke-width="6"/>
<text x="135" y="615" fill="#d7e0e8" font-size="25" font-weight="400" text-anchor="start" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">async delays execution;</text>
<text x="135" y="652" fill="#d7e0e8" font-size="25" font-weight="400" text-anchor="start" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">it does not make JavaScript run in parallel.</text>
<text x="895" y="615" fill="#d7e0e8" font-size="25" font-weight="400" text-anchor="start" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">callbacks still return to the main thread</text>
<text x="895" y="652" fill="#d7e0e8" font-size="25" font-weight="400" text-anchor="start" opacity="1" font-family="Inter, Pretendard, Apple SD Gothic Neo, system-ui, sans-serif">one by one.</text>

</svg>
